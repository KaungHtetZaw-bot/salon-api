# Salon Shop — production-style local stack (Postgres + API)
#
# Usage:
#   export JWT_ACCESS_SECRET=$(openssl rand -hex 32)
#   export JWT_REFRESH_SECRET=$(openssl rand -hex 32)   # must differ!
#   docker compose up --build
#
# Secrets can also live in the .env file next to this file.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon_shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salon -d salon_shop']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 'true'
      DATABASE_URL: postgresql://salon:salon@db:5432/salon_shop?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 30
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
